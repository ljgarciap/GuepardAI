<div class="sidebar">
  <div class="logo-area">
    <div class="logo-wrapper-elite">
      <img [src]="logoSrc" alt="Guepard AI" class="brand-logo-elite">
    </div>
    <div class="logo-text-elite">
      <h2>GUEPARD</h2>
      <p class="brand-subtitle-elite">Strategic Systems</p>
    </div>
  </div>

  <nav class="nav-menu">
    <div class="nav-section-label">STRATEGY</div>
    <a routerLink="/directory" routerLinkActive="active" class="nav-item-elite">
      <span class="nav-icon-elite">⊞</span>
      <span class="nav-link">Brand Directory</span>
    </a>
    <a routerLink="/library" routerLinkActive="active" class="nav-item-elite">
      <span class="nav-icon-elite">⧉</span>
      <span class="nav-link">Strategic Assets</span>
    </a>
    <div class="nav-section-spacer"></div>
    <div class="nav-section-label">GENERATION</div>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item-elite">
      <span class="nav-icon-elite">◈</span>
      <span class="nav-link">Synthesis Studio</span>
    </a>
    <a routerLink="/template-merge" routerLinkActive="active" class="nav-item-elite nav-item-template-merge">
      <span class="nav-icon-elite">⬡</span>
      <span class="nav-link">
        Template Merge
        <span class="nav-badge">NEW</span>
      </span>
    </a>
    <div class="nav-section-spacer"></div>
    <div class="nav-section-label">INTELLIGENCE</div>
    <a routerLink="/brands" routerLinkActive="active" class="nav-item-elite">
      <span class="nav-icon-elite">◇</span>
      <span class="nav-link">Intelligence Hub</span>
    </a>
    <div class="nav-section-label">SYSTEM</div>
    <button (click)="themeService.toggle()" class="nav-item-elite theme-toggle-elite" style="background: none; border: none; width: 100%; cursor: pointer; text-align: left;">
      <span class="nav-icon-elite">{{ themeService.theme() === 'dark' ? '☀' : '☾' }}</span>
      <span class="nav-link">{{ themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}</span>
    </button>
    <button *ngIf="isSuperadmin" (click)="resetSystem()" class="nav-item-elite reset-button-elite" style="background: none; border: none; width: 100%; cursor: pointer; text-align: left;">
      <span class="nav-icon-elite">⚡</span>
      <span class="nav-link">Reset System</span>
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="user-profile-lite" *ngIf="authService.currentUser$ | async as user">
      <div class="user-avatar-elite">{{ userInitial }}</div>
      <div class="user-info-elite">
        <span class="user-name-elite">{{ user.email }}</span>
        <span class="user-role-elite">{{ user.role }}</span>
      </div>
      <button (click)="logout()" class="logout-button-elite" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
    <p class="footer-text-elite">Platform v1.0 • © 2026</p>
  </div>
</div>
