<div class="auth-page">
  <form class="auth-card glass-panel" (ngSubmit)="submit()" #registerForm="ngForm">
    <div class="auth-header">
      <img [src]="logoSrc" alt="Guepard AI" class="auth-logo">
      <h1>GUEPARD</h1>
      <p>Strategic Systems — Crear organización</p>
    </div>

    <div class="form-field">
      <label for="tenantName">Nombre de la organización</label>
      <input
        id="tenantName"
        type="text"
        name="tenantName"
        [(ngModel)]="tenantName"
        placeholder="Mi Empresa (opcional)"
      />
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
        placeholder="tu@empresa.com"
      />
    </div>

    <div class="form-field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
      />
    </div>

    <p class="auth-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="auth-submit" [disabled]="registerForm.invalid || isLoading">
      {{ isLoading ? 'Creando…' : 'Crear cuenta y organización' }}
    </button>

    <p class="auth-footer-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
    </p>
  </form>
</div>
