name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Backend Tests
  # ───────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: "🐍 Backend Tests (pytest)"
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ai_db_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U root -d ai_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: "📦 Install Dependencies"
        run: pip install -r backend/requirements.txt
        working-directory: .

      - name: "⚙️ Create .env.test"
        run: cp backend/.env.test.example backend/.env.test

      - name: "🧪 Run pytest with Coverage"
        run: |
          python -m pytest \
            --cov=agents \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short \
            -v \
            tests/
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://root:root@localhost:5433/ai_db_test
          DATABASE_URL: postgresql+psycopg://root:root@localhost:5433/ai_db_test
          ANTHROPIC_API_KEY: "sk-test-fake-key"
          OPENAI_API_KEY: "sk-test-fake-key"
          MISTRAL_API_KEY: "fake-key"
          GOOGLE_AI_API_KEY: "fake-key"

      - name: "📊 Upload Coverage Report"
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Tests
  # ───────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: "🅰️ Frontend Tests (Karma/Jasmine)"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install npm Dependencies"
        run: npm ci --prefer-offline
        working-directory: frontend

      - name: "🧪 Run Angular Tests (Headless Chrome)"
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress
        working-directory: frontend

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to EC2
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to EC2"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    # Only run deploy if tests passed and push is on master branch
    if: ${{ github.ref == 'refs/heads/master' && success() }}

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🚀 Deploy via SSH to EC2"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "═══════════════════════════════════════════"
            echo "  GuepardAI Deploy — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "  Triggered after: CI Tests PASSED ✅"
            echo "═══════════════════════════════════════════"
            cd /home/ubuntu/GuepardAI
            git stash
            git fetch --all
            git reset --hard origin/master
            echo "🔨 Building and restarting production containers..."
            sudo docker compose up -d --build
            echo "🧹 Cleaning up Docker resources and BuildKit cache..."
            sudo docker system prune -f
            sudo docker builder prune -a -f
            echo "✅ Deployment completed successfully!"
            echo "═══════════════════════════════════════════"
