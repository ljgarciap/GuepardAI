<div class="auth-page">
  <form class="auth-card glass-panel" (ngSubmit)="submit()" #loginForm="ngForm">
    <div class="auth-header">
      <img [src]="logoSrc" alt="Guepard AI" class="auth-logo">
      <h1>GUEPARD</h1>
      <p>Strategic Systems — Iniciar sesión</p>
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
        placeholder="tu@empresa.com"
      />
    </div>

    <div class="form-field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
        placeholder="••••••••"
      />
    </div>

    <p class="auth-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="auth-submit" [disabled]="loginForm.invalid || isLoading">
      {{ isLoading ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <p class="auth-footer-link">
      ¿No tienes cuenta? <a routerLink="/register">Crear cuenta</a>
    </p>
  </form>
</div>
