<!-- SPLIT LAYOUT -->
<div class="absolute inset-0 flex">
    <!-- Image Panel: full-bleed, no padding so image reaches top/bottom edges of slide -->
    <div class="relative" style="width: 40%; flex-shrink: 0; overflow: hidden;">
        <img src="{{ slide.primary_image }}" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0" style="background: linear-gradient(to top, #0f172a, transparent); opacity: 0.6;"></div>
        <!-- Pill Label -->
        <div class="absolute top-6 left-6 px-4 py-2 bg-brand-secondary text-white text-[10px] font-extrabold uppercase tracking-[0.3em] rounded-full shadow-lg">
            {{ slide.section_label|default('Operational Logic') }}
        </div>
    </div>

    <!-- Content Panel: takes remaining width, owns its padding -->
    <div class="flex flex-col justify-center p-16" style="flex: 1; min-width: 0;">
        <div class="flex items-center gap-4 mb-8">
            <div class="h-accent"></div>
            <span class="text-brand-secondary font-bold tracking-[0.2em] text-xs uppercase">{{ slide.section_label|default('Operational Logic') }}</span>
        </div>

        <h1 class="text-5xl font-extrabold text-white mb-10 leading-[1.1] tracking-tight">
            {{ slide.title }}
        </h1>

        <ul class="space-y-6">
            {% for bullet in slide.bullets %}
            <li class="flex items-start gap-4 text-slate-300">
                {% if slide.bullet_icon %}
                <img src="{{ slide.bullet_icon }}" class="w-6 h-6 object-contain shrink-0 mt-1">
                {% else %}
                <div class="mt-2.5 h-2 w-2 rounded-full bg-brand-secondary shrink-0"></div>
                {% endif %}
                <span class="text-xl leading-relaxed">{{ bullet }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
