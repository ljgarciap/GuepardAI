server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # DNS interno de Docker con TTL corto: si el contenedor backend se recrea
    # (nueva IP), nginx re-resuelve en vez de quedarse con la IP muerta (502).
    # proxy_pass con variable fuerza la resolución en runtime, no en el arranque.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para el API
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para los Assets/Uploads (v39.0)
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy para el árbol público de storage (Reorganización de Storage v1)
    location /files/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
