<div class="app-layout" *ngIf="showShell(); else noShell">
  <!-- El panel de cristal izquierdo -->
  <aside class="sidebar-container glass-panel">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- El área de trabajo dinámica (Cambia según la URL) -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Login/registro: sin sidebar -->
<ng-template #noShell>
  <router-outlet></router-outlet>
</ng-template>

<app-confirm-modal></app-confirm-modal>
