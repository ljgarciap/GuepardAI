[pytest]
# Configuración de Pytest para GuepardAI Backend
# ================================================

# Directorio base de los tests
testpaths = tests

# Modo async: auto detecta funciones async sin necesidad de decorador @pytest.mark.asyncio
asyncio_mode = auto

# Añadir markers personalizados para clasificar tests
markers =
    unit: Tests unitarios (rápidos, sin IO real)
    integration: Tests de integración (requieren BD de test corriendo)
    slow: Tests lentos (ej: tests que generan archivos)

# Formato de los logs durante los tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Mostrar warnings en los tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
