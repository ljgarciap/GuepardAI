name: CI - Tests (Backend + Frontend)

# ─────────────────────────────────────────────────────────────────────────────
# Se ejecuta en CADA PUSH y PULL REQUEST a master o develop.
# El deploy SOLO puede ocurrir si este workflow pasa.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Tests del Backend (Python / pytest)
  # ───────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: "🐍 Backend Tests (pytest)"
    runs-on: ubuntu-latest

    # Servicios de infraestructura que se levantan junto al runner
    services:
      # Base de datos PostgreSQL de TEST — Puerto 5433 (nunca 5432)
      postgres_test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ai_db_test
        ports:
          - 5433:5432  # Host 5433 → Container 5432
        options: >-
          --health-cmd "pg_isready -U root -d ai_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: "📦 Install Dependencies"
        run: pip install -r backend/requirements.txt
        working-directory: .

      - name: "⚙️ Create .env.test"
        run: cp backend/.env.test.example backend/.env.test

      - name: "🧪 Run pytest with Coverage"
        run: |
          python -m pytest \
            --cov=agents \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short \
            -v \
            tests/
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://root:root@localhost:5433/ai_db_test
          DATABASE_URL: postgresql+psycopg://root:root@localhost:5433/ai_db_test
          ANTHROPIC_API_KEY: "sk-test-fake-key"
          OPENAI_API_KEY: "sk-test-fake-key"
          MISTRAL_API_KEY: "fake-key"
          GOOGLE_AI_API_KEY: "fake-key"

      - name: "📊 Upload Coverage Report"
        uses: codecov/codecov-action@v4
        if: always()  # Sube el reporte incluso si los tests fallan
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Tests del Frontend (Angular / Karma + Jasmine)
  # ───────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: "🅰️ Frontend Tests (Karma/Jasmine)"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install npm Dependencies"
        run: npm ci --prefer-offline
        working-directory: frontend

      - name: "🧪 Run Angular Tests (Headless Chrome)"
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress
        working-directory: frontend

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Gate de CI (resumen para que el deploy pueda usarlo como condición)
  # ───────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "🚦 CI Gate (All Tests Passed)"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]  # Solo pasa si AMBOS pasan
    if: always()

    steps:
      - name: "✅ All tests passed — Ready for deploy"
        if: ${{ needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success' }}
        run: echo "CI Gate PASSED. Deploy is authorized."

      - name: "❌ Tests failed — Deploy blocked"
        if: ${{ needs.backend-tests.result != 'success' || needs.frontend-tests.result != 'success' }}
        run: |
          echo "CI Gate FAILED."
          echo "Backend: ${{ needs.backend-tests.result }}"
          echo "Frontend: ${{ needs.frontend-tests.result }}"
          exit 1
